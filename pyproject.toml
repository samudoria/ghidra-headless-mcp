[project]
name = "ghidra-headless-mcp"
version = "1.1.0"
description = "Minimal headless MCP server for Ghidra: load, read, search, rename and comment native binaries."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["mcp>=1.2,<2", "pyghidra>=3.0,<4"]

[project.scripts]
ghidra-headless-mcp = "ghidra_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghidra_mcp"]
